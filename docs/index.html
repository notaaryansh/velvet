<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet, a Mac app for YouTube Music</title>
<meta name="description" content="Velvet is a small, fast Mac app for playing YouTube Music. Free and open source.">
<link rel="icon" href="icon.png">
<meta property="og:title" content="Velvet, a Mac app for YouTube Music">
<meta property="og:description" content="A small, fast Mac app for playing YouTube Music. Free and open source.">
<meta property="og:image" content="https://notaaryansh.github.io/velvet/screenshot.png">
<style>
  :root {
    --bg: #edeae1;
    --ink: #1c1b18;
    --muted: #6d675c;
    --wave-back: #a8465a;
    --wave-mid: #83243a;
    --wave-front: #511423;
    --on-wine: #f2e4e4;
    --on-wine-muted: #c9a7ab;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--wave-front);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }
  .top, .hero { background: var(--bg); }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0;
    position: relative;
    z-index: 2;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--ink);
    text-decoration: none;
  }
  .brand img { width: 28px; height: 28px; border-radius: 7px; }
  .nav { display: flex; align-items: center; gap: 18px; }
  .gh { display: flex; color: var(--muted); }
  .gh:hover { color: var(--ink); }
  .gh svg { width: 26px; height: 26px; }
  .pill {
    background: #1c1b18;
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    font-size: .95rem;
    padding: 10px 24px;
    border-radius: 999px;
  }
  .pill:hover { background: #33312c; }

  .hero {
    position: relative;
    text-align: center;
    padding-top: 48px;
  }
  .hero h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .hero .sub {
    margin: 16px auto 0;
    max-width: 32em;
    font-size: 1.1rem;
    color: var(--muted);
  }
  .shot {
    position: relative;
    z-index: 1;
    max-width: 1240px;
    width: 92%;
    margin: 56px auto 0;
  }
  .shot img {
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 30px 60px rgba(44,10,18,.45);
    display: block;
  }
  .waves {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 38vh;
    min-height: 240px;
    z-index: 0;
    pointer-events: none;
  }
  .wave {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    overflow: hidden;
  }
  .wave svg {
    display: block;
    width: 200%;
    height: 100%;
  }
  .wave-back  { height: 100%; }
  .wave-mid   { height: 72%; }
  .wave-front { height: 44%; }
  .wave-back svg  { animation: drift 38s linear infinite; }
  .wave-mid svg   { animation: drift 26s linear infinite reverse; }
  .wave-front svg { animation: drift 18s linear infinite; }
  @keyframes drift {
    to { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wave svg { animation: none; }
  }
  footer {
    position: relative;
    z-index: 1;
    padding: 48px 24px 10vh;
    text-align: center;
    font-size: .9rem;
    color: var(--on-wine-muted);
  }
  footer a { color: var(--on-wine); }
  a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
</style>
</head>
<body>
<div class="top">
<div class="wrap">
  <header>
    <a class="brand" href="#"><img src="icon.png" alt="">Velvet</a>
    <nav class="nav">
      <a class="gh" href="https://github.com/notaaryansh/velvet" aria-label="Velvet on GitHub">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <a class="pill" href="https://github.com/notaaryansh/velvet/releases/latest">Download</a>
    </nav>
  </header>
</div>
</div>

<section class="hero">
  <h1>The unofficial YouTube Music client for Mac.</h1>
  <p class="sub">Native, not Electron. The whole app is 9 MB. Free and open source.</p>

  <div class="waves" aria-hidden="true">
    <div class="wave wave-back">
      <svg viewBox="0 0 2880 320" preserveAspectRatio="none">
        <path fill="var(--wave-back)" d="M0,110 Q180,40 360,110 T720,110 T1080,110 T1440,110 T1800,110 T2160,110 T2520,110 T2880,110 L2880,320 L0,320 Z"/>
      </svg>
    </div>
    <div class="wave wave-mid">
      <svg viewBox="0 0 2880 320" preserveAspectRatio="none">
        <path fill="var(--wave-mid)" d="M0,115 Q120,55 240,115 T480,115 T720,115 T960,115 T1200,115 T1440,115 T1680,115 T1920,115 T2160,115 T2400,115 T2640,115 T2880,115 L2880,320 L0,320 Z"/>
      </svg>
    </div>
    <div class="wave wave-front">
      <svg viewBox="0 0 2880 320" preserveAspectRatio="none">
        <path fill="var(--wave-front)" d="M0,130 Q180,60 360,130 T720,130 T1080,130 T1440,130 T1800,130 T2160,130 T2520,130 T2880,130 L2880,320 L0,320 Z"/>
      </svg>
    </div>
  </div>

  <div class="shot">
    <img src="screenshot.png" alt="Velvet showing the Discover page with recently played albums and a song playing at the bottom">
  </div>
  <footer>
    Free and open source under AGPL-3.0. Needs macOS 15 or later.<br>
    <a href="https://github.com/notaaryansh/velvet">GitHub</a> &nbsp; <a href="https://github.com/notaaryansh/velvet/issues/new">Request a feature</a>
  </footer>
</section>
</body>
</html>
